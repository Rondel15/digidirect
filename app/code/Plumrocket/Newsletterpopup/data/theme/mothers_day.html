<link href="https://fonts.googleapis.com/css?family=Open+Sans|Work+Sans:700" rel="stylesheet">
<div class="mother-day first_popup">
    <div class="mother-day__container">
        <button class="mother-day__close close cross"><span>{{text_cancel}}</span></button>
        <div class="mother-day__wrapper">
            <div class="mother-day__bg val-bg">
                <img
                    src="{{view url='Plumrocket_Newsletterpopup::images/templates/theme30_mother-day_bg.png'}}"
                    alt=""
                    width="517"
                />
            </div>
            <div class="mother-day__content">
                <div class="mother-day__text">
                    <figure class="mother-day__title">
                        <img
                            src="{{view url='Plumrocket_Newsletterpopup::images/templates/theme30_mother-day_title.png'}}"
                            alt="Happy Mother Day"
                            width="334"
                        />
                    </figure>
                    <div class="mother-day__descr">
                        <span class="mother-day__subscr">
                            <span>{{text_title}}</span>
                        </span>
                        <span class="mother-day__off">10%OFF</span>
                        <span class="mother-day__order">{{text_description}}</span>
                    </div>
                </div>
                <button type="button" class="mother-day__btn show_secondary_popup">Subscribe</button>
            </div>
        </div>
    </div>
</div>

<div class="mother-day__form-wrap secondary_popup hidden">
    <form action="" method="post" class="mother-day__form">
        <button class="mother-day__close close cross"><span>{{text_cancel}}</span></button>
        {{form_fields}}
        <button type="submit" class="mother-day__btn">
            {{text_submit}}
        </button>
    </form>
</div>
