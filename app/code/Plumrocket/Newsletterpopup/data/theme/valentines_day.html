            <div class="valentine__content">
                <div class="valentine__text">
                    <figure class="valentine__title">
                        <img
                            src="{{view url='Plumrocket_Newsletterpopup::images/templates/theme28_header_text.png'}}"
                            alt="Happy Valentine's Day"
                            width="337"
                        />
                    </figure>
                    <div class="valentine__descr">
                        <span class="valentine__save"><span>GET</span></span>
                        <span class="valentine__14">{{text_title}}</span>
                        <span class="valentine__order">{{text_description}}</span>
                    </div>
                </div>
            </div>
            <button type="button" class="valentine__btn show_secondary_popup">
                {{text_submit}}
            </button>
        </div>
    </div>
</div>

<div class="valentine__form-wrap secondary_popup hidden">
    <form action="" method="post" class="valentine__form">
        <button class="valentine__close close cross"><span>{{text_cancel}}</span></button>
        {{form_fields}}
        <button type="submit" class="valentine__btn">
            {{text_submit}}
        </button>
    </form>
</div>
