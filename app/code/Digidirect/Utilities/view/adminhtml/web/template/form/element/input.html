<div class="admin__action-multiselect-wrap action-select-wrap auto-complete-wrap"
     data-bind="
     mageInit: {'Digidirect_Utilities/js/form/actions/ajax-auto-complete':{
        'url': url,
        'entityIdAttribute': entityIdAttribute,
        'entityNameAttribute': entityNameAttribute,
        'currentVal' : selectedEntity,
        'additionalData' : additionalData,
        'modalTitle': noticeTitle,
        'modalText' : noticeModal}},
        hasFocus: focused,
        css: {
            _disabled: disabled
        }
     ">
    <input type="hidden" data-role="hidden-input" data-bind="
            hasFocus: focused,
            value: value,
            valueUpdate: valueUpdate,
            event: {change: userChanges},
            attr: {
                name: inputName,
                placeholder: placeholder,
                'aria-describedby': noticeId,
                id: uid
            }
        ">
    <div class="action-select admin__action-multiselect auto-complete-label"
         data-action="open-search"
         data-bind="i18n: selectedEntity || 'Select...'">
    </div>
    <button
            class="action-close no-display"
            type="button"
            data-action="clear"
            data-bind="attr: {
            title: $t('Clear')
        }">
    </button>
    <div class="action-menu" data-role="search-block" style="z-index: 2;">
        <div class="admin__action-multiselect-search-wrap">
            <input class="admin__control-text" data-action="input-text" type="text"/>
            <label class="admin__action-multiselect-search-label"></label>
        </div>
    </div>
</div>
