<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="initial-scale=1.0, width=device-width" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <style type="text/css">
        {{var template_styles|raw}}

        {{css file="css/email.css"}}
    </style>
    <style type="text/css">
        html, body { margin:0; padding:0;}
        .mobile-only{display:none !important;}
        .mobile-only2{display:none !important;}
        input{display: none;}
        .gmailfix {display:none;display:none!important;}

        @media only screen and (max-width:760px) {
            html, body {
                margin: 0;
                padding: 0;
            }

            table {
                table-layout: auto !important;
            }

            .mobiletable {
                max-width: 760px !important;
                width: 100% !important;
            }

            .mobileStack {
                display: block;
                width: auto !important;
            }

            .mobile-only {
                display: block !important;
                max-height: none !important;
            }

            .calign {
                text-align: center !important;
            }

            .mobilehide {
                display: none !important;
            }

            .social-wrapper .contacts {
                padding-top: 20px;
            }

            .order-questions {
                padding: 20px 0;
                margin: 20px 0 0;
            }

            .address-details,
            .method-info {
                display: block;
                width: 100%;
            }

            .address-details.-shipping {
                padding-top: 17px;
            }
        }

        @media only screen and (max-width:475px) {
            .mobilehide2 {display:none !important;}
            .mobile-only2 {display: block !important;max-height: none !important;}
        }

        @media only screen and (min-width:761px) {
            .social {
                position: absolute;
                bottom: 0;
                right: 0;
            }

            .item-options dd {
                padding-left: 60px;
            }
        }
    </style>
</head>
<body>
{{inlinecss file="css/email-inline.css"}}

<!-- Begin wrapper table -->
<table class="wrapper" width="100%">
    <tr>
        <td class="wrapper-inner" align="center">
            <table class="main" align="center">
                <tr>
                    <td>
                        <table cellpadding="0" cellspacing="0" border="0" align="center" class="mobiletable" style="margin-bottom: 50px;">
                            <tbody>
                                <tr>
                                    <td class="header">
                                        <a class="logo" href="{{store url=""}}">
                                        <img
                                                {{if logo_width}}
                                                width="{{var logo_width}}"
                                                {{else}}
                                                width="180"
                                                {{/if}}

                                        {{if logo_height}}
                                        height="{{var logo_height}}"
                                        {{/if}}

                                        src="{{var logo_url}}"
                                        alt="{{var logo_alt}}"
                                        border="0"
                                        />
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <table cellpadding="0" cellspacing="0" border="0" align="center" class="mobiletable" style="display: none;">
                            <tbody>
                            <tr>
                                <td class="header-image">
                                    <img class="image" src="{{view url='Magento_Email::images/email-bg.jpg'}}" alt="background-image">
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <table cellpadding="0" cellspacing="0" border="0" align="center" class="mobiletable">
                            <tbody>
                                <tr>
                                    <td class="main-content">
                                    <!-- Begin Content -->
